services:
  # ----------------------------------------------------------------------------
  # Render Web Service for FastAPI Backend
  # ----------------------------------------------------------------------------
  - type: web
    name: iot-soc-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_HOST
        value: 0.0.0.0
      - key: API_DEBUG
        value: "false"
      - key: DEFAULT_DETECTOR
        value: random_forest
      - key: MODELS_DIR
        value: models
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false # Set securely in Render dashboard
      - key: DATABASE_URL
        sync: false # Set Supabase connection URI in Render dashboard
      - key: SUPABASE_URL
        value: https://mxiyhuombyyfjytvwfgk.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_cfOqulwUs8J412rjvtIlJw_0bZwUX_s
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
